<!doctype html>

<head>

<meta name="robots" content="noindex, nofollow">

<style>
:root{--canvas:#1F130C;--accent:#F0B94B;--ink:#F6F1E6;--ink-2:#B9AC98;--line:rgba(240,185,75,.42);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);
  font:400 1rem/1.6 'DM Sans',system-ui,sans-serif;text-align:center;padding:2rem}
svg{width:120px;height:26px;color:var(--accent)}
h1{font:400 clamp(2rem,7vw,3rem)/1.1 'Prata',Georgia,serif;margin:1.2rem 0 .6rem}
p{color:var(--ink-2);margin:0 auto;max-width:28rem}
.acoes{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.8rem}
a{display:inline-flex;align-items:center;min-height:48px;padding:.8rem 1.4rem;border-radius:999px;text-decoration:none;font-weight:500}
.ouro{background:var(--accent);color:var(--canvas)}
.linha{border:1px solid var(--line);color:var(--ink)}
</style>
<script src="/assets/hoje.js"></script>
</head>
<body>
<main>
  <svg viewBox="0 0 120 26" aria-hidden="true"><ellipse cx="60" cy="13" rx="56" ry="10" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
  <h1>Essa página não existe.</h1>
  <p>O endereço pode ter mudado ou estar digitado errado. Pelos botões abaixo você volta pro Santo Strike.</p>

    <a class="ouro" href="/reserva/">Fazer reserva</a>
    <a class="linha" href="/">Ir para o site</a>
  </div>
</main>
<script src="/assets/teste.js" defer></script>
